<div class="d-flex flex-column min-vh-100">
  @if (isAuthPage()) {
    <!-- Full-screen split view for Login and Register (no top navbar) -->
    <router-outlet></router-outlet>
  } @else {
    <!-- Standard application shell for logged-in and content pages -->
    <nav class="navbar navbar-expand-lg border-bottom sticky-top" style="background-color: var(--surface);">
      <div class="container">
        <app-logo></app-logo>

        <button
          class="navbar-toggler border-0"
          type="button"
          (click)="isCollapsed.set(!isCollapsed())"
          [attr.aria-expanded]="!isCollapsed()"
          aria-label="Växla navigationsmeny"
        >
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>

        <div [ngbCollapse]="isCollapsed()" class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3 gap-lg-1">
            <li class="nav-item">
              <a
                class="nav-link px-3"
                routerLink="/books"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: false }"
                (click)="isCollapsed.set(true)"
              >
                <i class="fa-solid fa-book me-1" aria-hidden="true"></i>
                Böcker
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link px-3"
                routerLink="/quotes"
                routerLinkActive="active"
                (click)="isCollapsed.set(true)"
              >
                <i class="fa-solid fa-quote-left me-1" aria-hidden="true"></i>
                Mina citat
              </a>
            </li>
          </ul>

          <div class="d-flex align-items-center gap-3">
            <!-- Sleek Pill Theme Switcher -->
            <button
              type="button"
              class="theme-toggle-pill btn d-inline-flex align-items-center justify-content-between p-1 px-2"
              (click)="theme.toggle()"
              aria-label="Byt färgtema"
              title="Byt färgtema"
            >
              <span class="pill-icon sun" [class.active]="theme.current() === 'light'">
                <i class="fa-solid fa-sun" aria-hidden="true"></i>
              </span>
              <span class="pill-icon moon" [class.active]="theme.current() === 'dark'">
                <i class="fa-solid fa-moon" aria-hidden="true"></i>
              </span>
            </button>

            @if (auth.isLoggedIn()) {
              <div ngbDropdown class="d-inline-block">
                <button
                  type="button"
                  class="btn btn-outline-secondary border-0 btn-sm d-flex align-items-center gap-2 user-menu-btn"
                  id="userDropdown"
                  ngbDropdownToggle
                >
                  <div class="user-avatar-circle" aria-hidden="true">
                    {{ userInitials() }}
                  </div>
                  <span class="fw-medium">{{ auth.username() }}</span>
                </button>
                <div ngbDropdownMenu aria-labelledby="userDropdown" class="dropdown-menu-end shadow-lg">
                  <button
                    type="button"
                    ngbDropdownItem
                    class="text-danger d-flex align-items-center gap-2"
                    (click)="auth.logout()"
                  >
                    <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
                    <span>Logga ut</span>
                  </button>
                </div>
              </div>
            } @else {
              <a routerLink="/login" class="btn btn-primary btn-sm">
                Logga in
              </a>
            }
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-4 flex-grow-1">
      <router-outlet></router-outlet>
    </main>
  }

  <app-toast-container></app-toast-container>
</div>
