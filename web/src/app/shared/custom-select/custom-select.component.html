<div class="d-inline-flex flex-column custom-select-wrapper">
  @if (label()) {
    <label for="customSelectTrigger" class="form-label select-field-label mb-1">{{ label() }}</label>
  }
  <div ngbDropdown placement="bottom-start" class="d-inline-block custom-select-dropdown">
    <button
      type="button"
      class="btn custom-select-trigger d-inline-flex align-items-center justify-content-between"
      id="customSelectTrigger"
      ngbDropdownToggle
      [attr.aria-label]="ariaLabel()"
    >
      <span class="d-inline-flex align-items-center gap-2 text-truncate">
        <span class="select-value fw-medium text-body">
          {{ selectedOption()?.label ?? placeholder() }}
        </span>
      </span>
      <i class="fa-solid fa-chevron-down select-chevron ms-2 text-muted" aria-hidden="true"></i>
    </button>

    <div ngbDropdownMenu aria-labelledby="customSelectTrigger" class="dropdown-menu shadow-lg py-1">
      @for (option of options(); track option.value) {
        <button
          type="button"
          ngbDropdownItem
          class="dropdown-item d-flex align-items-center justify-content-between py-2 px-3"
          [class.active-item]="option.value === value()"
          (click)="selectOption(option.value)"
        >
          <span class="option-label" [class.fw-semibold]="option.value === value()">
            {{ option.label }}
          </span>
          @if (option.value === value()) {
            <i class="fa-solid fa-check ms-3 check-icon" aria-hidden="true"></i>
          }
        </button>
      }
    </div>
  </div>
</div>
