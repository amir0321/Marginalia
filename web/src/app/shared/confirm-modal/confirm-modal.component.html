<div class="confirm-modal-wrapper">
  <div class="d-flex justify-content-end mb-1">
    <button
      type="button"
      class="btn-icon"
      aria-label="Stäng dialog"
      (click)="activeModal.dismiss('cancel')"
    >
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
  </div>

  <div class="text-center px-2">
    <div class="delete-icon-circle mx-auto mb-3" aria-hidden="true">
      <i class="fa-solid fa-trash"></i>
    </div>

    <h2 class="confirm-modal-title" id="confirm-modal-title">{{ title() }}</h2>
    <p class="confirm-modal-msg mb-1">{{ message() }}</p>
    @if (supportText()) {
      <p class="confirm-modal-support text-muted">{{ supportText() }}</p>
    }
  </div>

  <footer class="confirm-modal-footer">
    <button
      type="button"
      class="btn btn-secondary"
      (click)="activeModal.dismiss('cancel')"
    >
      {{ cancelText() }}
    </button>
    <button
      type="button"
      class="btn btn-danger"
      (click)="activeModal.close(true)"
    >
      {{ confirmText() }}
    </button>
  </footer>
</div>
