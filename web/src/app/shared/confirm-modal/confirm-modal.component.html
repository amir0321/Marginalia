<div class="confirm-modal-wrapper" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
  <div class="d-flex justify-content-end mb-1">
    <button
      type="button"
      class="btn-icon"
      aria-label="Stäng dialog"
      [disabled]="isSubmitting()"
      (click)="dismiss('cancel')"
    >
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
  </div>

  <div class="text-center px-2">
    <div class="delete-icon-circle mx-auto mb-3" aria-hidden="true">
      <i class="fa-solid fa-trash"></i>
    </div>

    <h2 class="confirm-modal-title" id="confirm-modal-title">{{ title() }}</h2>
    <p class="confirm-modal-msg mb-1">{{ message() }}</p>
    @if (supportText()) {
      <p class="confirm-modal-support text-muted">{{ supportText() }}</p>
    }
  </div>

  <footer class="confirm-modal-footer">
    <button
      type="button"
      class="btn btn-secondary"
      [disabled]="isSubmitting()"
      (click)="dismiss('cancel')"
    >
      {{ cancelText() }}
    </button>
    <button
      type="button"
      class="btn btn-danger"
      [disabled]="isSubmitting()"
      (click)="onConfirm()"
    >
      @if (isSubmitting()) {
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        <span>Raderar…</span>
      } @else {
        {{ confirmText() }}
      }
    </button>
  </footer>
</div>
