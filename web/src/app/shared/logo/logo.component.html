<a
  [routerLink]="linkUrl()"
  class="brand-logo d-inline-flex align-items-center text-decoration-none"
  [class.on-dark]="onDark()"
  [attr.aria-label]="ariaLabel()"
>
  <svg
    class="logo-icon"
    viewBox="0 0 34 28"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
    [style.width.px]="iconWidth()"
    [style.height.px]="iconHeight()"
  >
    <!-- Open book shape (left and right pages) -->
    <path
      class="book-pages"
      d="M17 6.5C13.5 3.5 7.5 3 2 4.5V23.5C7.5 22 13.5 22.5 17 25.5C20.5 22.5 26.5 22 32 23.5V4.5C26.5 3 20.5 3.5 17 6.5Z"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Central spine dividing line -->
    <path
      class="book-spine"
      d="M17 6.5V25.5"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    />
    <!-- Distinctive amber margin stroke on the left page -->
    <line
      class="amber-mark"
      x1="8.5"
      y1="9.5"
      x2="8.5"
      y2="17.5"
      stroke="#E8A33D"
      stroke-width="2.2"
      stroke-linecap="round"
    />
  </svg>

  @if (showText()) {
    <span class="brand-text ms-2 font-fraunces">Marginalia</span>
  }
</a>
