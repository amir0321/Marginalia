<a
  [routerLink]="linkUrl()"
  class="brand-logo"
  [class.on-dark]="onDark()"
  [class.is-compact]="compact()"
  [attr.aria-label]="ariaLabel()"
>
  <svg class="logo-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
    <path
      d="M4.5 6.5c4.7-1.2 8.3.2 11.5 2.7v17c-3.2-2.5-6.8-3.8-11.5-2.7v-17Z"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <path
      d="M27.5 6.5c-4.7-1.2-8.3.2-11.5 2.7v17c3.2-2.5 6.8-3.8 11.5-2.7v-17Z"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <path d="M9.5 8v14" stroke="currentColor" stroke-width="1.5" />
    <path d="M6.7 12.5h1.2" stroke="var(--amber)" stroke-width="2.6" stroke-linecap="round" />
  </svg>

  @if (showText()) {
    <span class="brand-text">Marginalia</span>
  }
</a>
