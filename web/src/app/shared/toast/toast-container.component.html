<div
  class="toast-container position-fixed bottom-0 end-0 p-3"
  style="z-index: 1200;"
  aria-live="polite"
  aria-atomic="true"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="toast show align-items-center mb-2"
      [class.text-bg-success]="toast.type === 'success'"
      [class.text-bg-danger]="toast.type === 'danger'"
      [class.text-bg-warning]="toast.type === 'warning'"
      [class.text-bg-primary]="toast.type === 'info'"
      role="status"
      aria-live="assertive"
    >
      <div class="d-flex">
        <div class="toast-body">
          @if (toast.type === 'success') {
            <i class="fa-solid fa-check me-2" aria-hidden="true"></i>
          } @else if (toast.type === 'danger') {
            <i class="fa-solid fa-circle-exclamation me-2" aria-hidden="true"></i>
          } @else if (toast.type === 'warning') {
            <i class="fa-solid fa-triangle-exclamation me-2" aria-hidden="true"></i>
          } @else {
            <i class="fa-solid fa-circle-info me-2" aria-hidden="true"></i>
          }
          {{ toast.message }}
        </div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          aria-label="Stäng notis"
          (click)="toastService.dismiss(toast.id)"
        ></button>
      </div>
    </div>
  }
</div>
