$kind: http-request
description: Sparar ett nytt citat. Returnerar 409 Conflict om användaren redan har 5 sparade citat.
url: "{{baseUrl}}/api/quotes"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "text": "Ja visst gör det ont när knoppar brister. Varför skulle annars våren tveka?",
      "author": "Karin Boye"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
          const data = pm.response.json();
          if (data.id) {
              pm.collectionVariables.set("quoteId", data.id);
              console.log("quoteId sparades till variabeln: " + data.id);
          }
      }
    language: text/javascript
order: 2000
